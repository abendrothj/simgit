[package]
name        = "simgit-cli"
description = "simgit — disk-efficient copy-on-write Git worktrees for running many agents at once"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage    = "https://github.com/abendrothj/simgit"
readme      = "../README.md"
keywords    = ["git", "worktree", "copy-on-write", "agents", "cli"]
categories  = ["command-line-utilities", "development-tools"]

[lib]
name = "simgit_cli"
path = "src/lib.rs"

[[bin]]
name = "simgit"
path = "src/bin/simgit.rs"

[[bin]]
name = "sg"
path = "src/bin/sg.rs"

[dependencies]
clap.workspace        = true
serde_json.workspace  = true
anyhow.workspace      = true
uuid.workspace        = true
sha1.workspace        = true

# cargo-binstall: fetch the prebuilt `simgit` and `sg` binaries from GitHub
# Releases. Archives are named sg-<target>.tar.gz and contain both binaries.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/sg-{ target }{ archive-suffix }"
bin-dir = "sg-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
