name: Release

# On every version tag, build `simgit` for the common targets and publish
# sg-<target>.tar.gz archives containing both the canonical `simgit` executable
# and its `sg` alias. The archive layout matches sg/Cargo.toml's cargo-binstall
# metadata.

on:
  push:
    tags: ["v*"]

# Only the job that publishes may write; everything before it reads.
permissions:
  contents: read

jobs:
  verify:
    # Nine commits were released this session while CI was red. Artifacts now
    # require the same gate CI applies, so a tag cannot ship a broken tree.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Verify release tag matches package version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "simgit-cli"))')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "release tag $GITHUB_REF_NAME does not match simgit-cli v$version" >&2
            exit 1
          fi
      - name: Verify the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main" >&2
            exit 1
          fi
      - name: Verify CI passed for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --workflow ci.yml --status success --json databaseId --jq length)"
          if [ "$passed" -eq 0 ]; then
            echo "no successful CI run for $GITHUB_SHA; tag a commit whose CI is green" >&2
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Packaging builds the crate from the files crates.io would get, which
      # catches a manifest or include list that only works in this checkout.
      - run: cargo package --locked -p simgit-cli

  test:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: cargo test --all --locked
      - run: python3 tests/cli_picker.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            native: true
          - target: x86_64-apple-darwin
            os: macos-latest
            native: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            native: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            native: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          # Marks the binary as a release build, the only kind `simgit update`
          # replaces with a newer release.
          SIMGIT_RELEASE_BUILD: "1"
        run: cargo build --release --locked --target ${{ matrix.target }} -p simgit-cli
      - name: Package
        run: |
          dir="sg-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/simgit" "$dir/simgit"
          cp "target/${{ matrix.target }}/release/simgit" "$dir/sg"
          cp README.md LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
      # Run what a user would install, from the archive itself, on the
      # targets this runner can execute.
      - name: Smoke-test the archive
        if: matrix.native
        run: |
          smoke="$(mktemp -d)"
          tar xzf "sg-${{ matrix.target }}.tar.gz" -C "$smoke"
          bin="$smoke/sg-${{ matrix.target }}"
          cmp "$bin/simgit" "$bin/sg"
          test "$("$bin/simgit" --version)" = "simgit ${GITHUB_REF_NAME#v}"
          (cd "$smoke" && "$bin/simgit" --json doctor >/dev/null)
      - name: Upload packaged target
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ matrix.target }}
          path: sg-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `gh release create --verify-tag` resolves the tag through git, so the
      # publishing job needs the repository, not just the built artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Download packaged targets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksum manifest
        working-directory: dist
        run: |
          sha256sum \
            sg-aarch64-apple-darwin.tar.gz \
            sg-x86_64-apple-darwin.tar.gz \
            sg-aarch64-unknown-linux-gnu.tar.gz \
            sg-x86_64-unknown-linux-gnu.tar.gz \
            > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
      # Every simgit since 0.5.0 trusts only this key, so a release that
      # cannot be signed with it, or verified by sg/minisign.pub, stops here.
      - name: Sign the checksum manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          test -n "$MINISIGN_SECRET_KEY" || { echo "MINISIGN_SECRET_KEY is not set" >&2; exit 1; }
          sudo apt-get update && sudo apt-get install -y minisign
          key="$RUNNER_TEMP/minisign.key"
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          minisign -S -s "$key" -m dist/SHA256SUMS -t "simgit $GITHUB_REF_NAME"
          rm -f "$key"
          minisign -V -p sg/minisign.pub -m dist/SHA256SUMS
      # Stage everything on a draft and check what GitHub now serves before
      # anyone can see it; only then publish.
      - name: Stage the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != true ]; then
              echo "release $tag is already published; refusing to replace its assets" >&2
              exit 1
            fi
          else
            gh release create "$tag" --draft --verify-tag --title "$tag" --generate-notes
          fi
          gh release upload "$tag" \
            dist/sg-aarch64-apple-darwin.tar.gz \
            dist/sg-x86_64-apple-darwin.tar.gz \
            dist/sg-aarch64-unknown-linux-gnu.tar.gz \
            dist/sg-x86_64-unknown-linux-gnu.tar.gz \
            dist/SHA256SUMS \
            dist/SHA256SUMS.minisig \
            --clobber
      - name: Check the staged assets against the checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          staged="$(mktemp -d)"
          gh release download "$GITHUB_REF_NAME" --dir "$staged"
          cd "$staged"
          test "$(find . -type f | wc -l)" -eq 6
          minisign -V -p "$GITHUB_WORKSPACE/sg/minisign.pub" -m SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
