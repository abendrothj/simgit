name: Release

# On every version tag, build `simgit` for the common targets and publish
# sg-<target>.tar.gz archives containing both the canonical `simgit` executable
# and its `sg` alias. The archive layout matches sg/Cargo.toml's cargo-binstall
# metadata.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    # Nine commits were released this session while CI was red. Artifacts now
    # require the same gate CI applies, so a tag cannot ship a broken tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all --locked
      - run: python3 tests/cli_picker.py

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} -p simgit-cli
      - name: Package
        run: |
          dir="sg-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/simgit" "$dir/simgit"
          cp "target/${{ matrix.target }}/release/simgit" "$dir/sg"
          cp README.md LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
      - name: Upload packaged target
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.target }}
          path: sg-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged targets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksum manifest
        working-directory: dist
        run: |
          sha256sum \
            sg-aarch64-apple-darwin.tar.gz \
            sg-x86_64-apple-darwin.tar.gz \
            sg-aarch64-unknown-linux-gnu.tar.gz \
            sg-x86_64-unknown-linux-gnu.tar.gz \
            > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
      - name: Attach archives and checksum manifest to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes
          fi
          gh release upload "$tag" \
            dist/sg-aarch64-apple-darwin.tar.gz \
            dist/sg-x86_64-apple-darwin.tar.gz \
            dist/sg-aarch64-unknown-linux-gnu.tar.gz \
            dist/sg-x86_64-unknown-linux-gnu.tar.gz \
            dist/SHA256SUMS \
            --clobber
