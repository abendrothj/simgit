name: CI

on:
  push:
    # Tags are verified by the release workflow, which gates artifacts on the
    # same checks; running both would duplicate every release into two runs.
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
permissions:
  contents: read

# A newer push to the same ref makes the older run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    # Formatting and lints are platform-independent; running them once keeps
    # a failure attributable to one job instead of two identical ones.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The release workflow signs SHA256SUMS only on a tag; run the same
      # commands with a throwaway key on every push so they cannot rot.
      - name: Exercise release signing
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          cd "$RUNNER_TEMP"
          minisign -G -W -p throwaway.pub -s throwaway.key
          printf '%064d  sg-x86_64-unknown-linux-gnu.tar.gz\n' 0 > SHA256SUMS
          minisign -S -s throwaway.key -m SHA256SUMS -t "simgit test"
          minisign -V -p throwaway.pub -m SHA256SUMS
          test "$(wc -l < "$GITHUB_WORKSPACE/sg/minisign.pub")" -eq 2
          sed -n 2p "$GITHUB_WORKSPACE/sg/minisign.pub" | grep -Eq '^RW[A-Za-z0-9+/]{54}$'

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      # `--locked` catches a stale Cargo.lock here rather than at release
      # time, where the build already uses it.
      - run: cargo test --all --locked
      - run: python3 tests/cli_picker.py

  minimums:
    # The oldest Rust (rust-version) and Git that simgit supports, in one
    # image: Rust 1.89 on Debian bookworm, whose Git is 2.39. simgit's own
    # floor is Git 2.36, for `git worktree list -z`.
    runs-on: ubuntu-latest
    container: rust:1.89-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: minimums
      - run: git --version && rustc --version
      - run: cargo test --all --locked

  reflink-linux:
    # Exercises the native FICLONE path on a real reflink filesystem; the
    # standard Ubuntu runner filesystem is not guaranteed to support it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Reflink integration tests
        run: bash tests/reflink_integration.sh

  overlay-linux:
    # Validates the fuse-overlayfs populate mode, which cannot run on macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Install fuse-overlayfs
        run: sudo apt-get update && sudo apt-get install -y fuse-overlayfs
      - run: cargo build --release --locked
      - name: Overlay integration test
        run: SG="$PWD/target/release/sg" bash tests/overlay_integration.sh

  linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: aarch64
      - name: Install Linux ARM64 linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Cross-build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target aarch64-unknown-linux-gnu -p simgit-cli
